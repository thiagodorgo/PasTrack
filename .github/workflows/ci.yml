name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      banco:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pastrack
          POSTGRES_PASSWORD: pastrack
          POSTGRES_DB: pastrack_teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pastrack -d pastrack_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Migrations em sincronia com o schema
        env:
          PGPASSWORD: pastrack
          DATABASE_URL: postgresql://pastrack:pastrack@localhost:5433/pastrack_teste?schema=public
          SHADOW_DATABASE_URL: postgresql://pastrack:pastrack@localhost:5433/pastrack_sombra?schema=public
        run: |
          psql -h localhost -p 5433 -U pastrack -d pastrack_teste -c "CREATE DATABASE pastrack_sombra"
          npm run db:verificar

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Testes dos scripts do repositório
        working-directory: .
        run: node --test scripts/

      - name: Confere a documentação de perfis
        working-directory: .
        run: node scripts/gerar-doc-perfis.mjs --verificar

      - name: Build
        run: npm run build

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Guarda os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend
          path: tests/results/latest/
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Guarda os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-frontend
          path: tests/results/latest/
          if-no-files-found: ignore
          retention-days: 30

  compose:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepara um .env descartável para esta execução
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SEED_ADMIN_SENHA=.*|SEED_ADMIN_SENHA=Ci$(openssl rand -hex 8)x9|" .env

      - name: Sobe banco, API e web
        run: docker compose up -d --build --wait

      - name: Health check pelo nginx
        run: curl -fsS http://localhost:8080/api/health

      - name: Login do administrador inicial
        run: |
          SENHA=$(grep '^SEED_ADMIN_SENHA=' .env | cut -d= -f2)
          STATUS=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json' -d "{\"email\":\"admin@pastrack.local\",\"senha\":\"$SENHA\"}")
          echo "status do login: $STATUS"
          test "$STATUS" = "200"

      - name: Cabeçalhos de segurança e fallback da SPA
        run: |
          curl -sI http://localhost:8080/ | tee /tmp/cabecalhos.txt
          grep -qi '^content-security-policy:' /tmp/cabecalhos.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/cabecalhos.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/pastilhas)" = "200"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

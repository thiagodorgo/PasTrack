name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      banco:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pastrack
          POSTGRES_PASSWORD: pastrack
          POSTGRES_DB: pastrack_teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pastrack -d pastrack_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Migrations em sincronia com o schema
        env:
          PGPASSWORD: pastrack
          DATABASE_URL: postgresql://pastrack:pastrack@localhost:5433/pastrack_teste?schema=public
          SHADOW_DATABASE_URL: postgresql://pastrack:pastrack@localhost:5433/pastrack_sombra?schema=public
        run: |
          psql -h localhost -p 5433 -U pastrack -d pastrack_teste -c "CREATE DATABASE pastrack_sombra"
          npm run db:verificar

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Guarda os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend
          path: tests/results/latest/
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Guarda os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-frontend
          path: tests/results/latest/
          if-no-files-found: ignore
          retention-days: 30

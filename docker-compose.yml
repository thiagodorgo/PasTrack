# PasTrack completo: banco PostgreSQL, API e front-end servido pelo nginx.
# Uso: cp .env.example .env, preencha as senhas e rode docker compose up -d --build --wait
name: pastrack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pastrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-pastrack}
    volumes:
      - dados-banco:/var/lib/postgresql/data
    # publicado só nesta máquina, para o modo de desenvolvimento
    ports:
      - "127.0.0.1:${DB_PORTA:-5432}:5432"
    healthcheck:
      # via TCP: o servidor temporário da primeira inicialização só escuta no socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pastrack}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@banco:5432/${POSTGRES_DB:-pastrack}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # um proxy reverso na frente: o nginx do serviço web
      TRUST_PROXY: "1"
      BCRYPT_CUSTO: ${BCRYPT_CUSTO:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pastrack.local}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_SENHA: ${SEED_DEMO_SENHA:-}
    # sem porta no host: o acesso passa pelo nginx do serviço web
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      # migrations e seed rodam antes de a API começar a responder
      start_period: 90s
      start_interval: 2s
    restart: unless-stopped
    logging: *logging

  web:
    build: ./frontend
    # todas as interfaces: outros computadores da rede acessam pelo IP desta máquina
    ports:
      - "${WEB_PORTA:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s
    restart: unless-stopped
    logging: *logging

volumes:
  dados-banco:

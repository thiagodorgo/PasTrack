# Front-end do PasTrack: arquivos estáticos do Vite e proxy de /api para a API.
# O acesso é por HTTP na rede local, por isso não há HSTS nem upgrade-insecure-requests.

# Cache por caminho. Fica no nível do server porque um add_header dentro de um location
# apagaria os cabeçalhos de segurança herdados. Valor vazio: o cabeçalho não é enviado.
map $uri $pastrack_cache {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    /index.html "no-cache";
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $pastrack_cache;

    # DNS interno do Docker: o nome "api" é resolvido de novo a cada 10 s,
    # então o proxy continua funcionando quando o container da API é recriado com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_destino http://api:3333;
        proxy_pass $api_destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # arquivos com hash no nome: nunca mudam, e um arquivo ausente é 404 (não cai na SPA)
    location /assets/ {
        try_files $uri =404;
    }

    # SPA: qualquer outra rota devolve o index.html e o React Router assume
    location / {
        try_files $uri /index.html;
    }
}
